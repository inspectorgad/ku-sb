name: Deploy dashboard to GitHub Pages

on:
  workflow_dispatch:
  # The workflow token can deploy to Pages but cannot CREATE the Pages
  # site ("Resource not accessible by integration"), so Pages needs one
  # manual enable: repo Settings -> Pages -> Source: "GitHub Actions".
  # This hourly schedule publishes automatically once that's done; it can
  # be removed after the first green deploy (pushes also trigger deploys).
  schedule:
    - cron: '25 * * * *'
  push:
    branches:
      - main
      - claude/ku-softball-stats-app-07iqli
    paths:
      - 'docs/**'
      - 'scripts/build-dashboard.py'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Rebuild from the seed so the page always matches the committed data,
      # even if docs/ and seed.json ever get out of sync.
      - name: Build dashboard
        run: python3 scripts/build-dashboard.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
