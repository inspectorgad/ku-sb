name: Deploy dashboard to GitHub Pages

on:
  workflow_dispatch:
  # NOTE: this deploys only once GitHub Pages is enabled on the repo
  # (Settings -> Pages -> Source: "GitHub Actions"). Until then the job
  # fails at setup, because the github-pages environment doesn't exist.
  # It runs on pushes that change the dashboard, and the nightly scrape
  # dispatches it explicitly when the season data changes.
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'scripts/build-dashboard.py'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Rebuild from the seed so the page always matches the committed data,
      # even if docs/ and seed.json ever get out of sync.
      - name: Build dashboard
        run: python3 scripts/build-dashboard.py

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
