name: Scrape KU Softball data

on:
  workflow_dispatch:
  # Fires nightly at 09:00 UTC (4 AM Central) — after even late games are
  # final — but the gate job below skips scheduled runs down to weekly
  # (Mondays) during the off-season (July through January).
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - main
      - claude/ku-softball-stats-app-07iqli
    paths:
      - 'scrape-trigger.txt'
      - 'scripts/scrape-ku-sb.mjs'
      - 'scripts/update-seed.py'
      - '.github/workflows/scrape-data.yml'

permissions:
  contents: write
  actions: write

jobs:
  # Off-season throttle: D1 softball runs February to mid-June, so between
  # July and January nothing changes night to night — scheduled runs are
  # skipped except on Mondays. Manual dispatches and pushes always run,
  # and Feb-Jun scheduled runs are nightly again with no changes needed.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        run: |
          month=$(date -u +%-m)
          dow=$(date -u +%u)   # 1 = Monday
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && \
             { [ "$month" -ge 7 ] || [ "$month" -eq 1 ]; } && \
             [ "$dow" -ne 1 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Off-season (month $month) and not Monday — skipping nightly scrape."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm init -y > /dev/null
          npm install playwright@1.49.0 > /dev/null
          npx playwright install --with-deps chromium

      - name: Scrape kuathletics + NCAA data
        env:
          # Season years: 2026 is the Spring 2026 season.
          SEASONS: '2026'
        run: node scripts/scrape-ku-sb.mjs

      - name: Rebuild seed from scraped data
        run: python3 scripts/update-seed.py

      - name: Rebuild dashboard from seed
        run: python3 scripts/build-dashboard.py

      - name: Commit scraped data, seed, and dashboard updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f scraped/
          git diff --cached --quiet || git commit -m "Update scraped KU Softball data [skip ci]"
          git add app/src/main/assets/seed.json docs/
          if git diff --cached --quiet; then
            echo "seed_changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update season data from nightly scrape [skip ci]"
            echo "seed_changed=true" >> "$GITHUB_OUTPUT"
          fi
          git push

      # Pushes made with GITHUB_TOKEN never trigger push workflows (GitHub's
      # recursion guard), so the APK rebuild and Pages deploy must be
      # dispatched explicitly — workflow_dispatch is exempt from that guard.
      - name: Rebuild APK and redeploy dashboard with new season data
        if: steps.commit.outputs.seed_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-apk.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
          gh workflow run deploy-pages.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
