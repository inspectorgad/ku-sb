name: Probe 5 - Softball rankings slug discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe5-ku-sb.mjs'
      - '.github/workflows/probe5-data.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run slug-discovery probe
        run: node scripts/probe5-ku-sb.mjs

      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe5/
          git diff --cached --quiet || git commit -m "Add rankings slug discovery results [skip ci]"
          git push
