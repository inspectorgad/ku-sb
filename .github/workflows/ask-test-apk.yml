name: Ask test APK

# A test build of the Ask Claude branch, for installing over the everyday app.
#
# build-apk.yml is the only other APK workflow and it always publishes to the
# rolling "latest-apk" release — the one the installed app updates from and the
# one the README links. This publishes to its own "ask-test" prerelease instead
# and never marks it latest, so the everyday APK, season-data.json and
# ask-data.json that `releases/latest/download` serves are all left alone.
#
# Do not reach for scrape-data.yml to refresh the data on a branch: its last
# step dispatches build-apk.yml and deploy-pages.yml on the same ref, which
# would publish a branch build over the stable one.
on:
  workflow_dispatch:
  push:
    # Any working branch, rather than one named here: the first version named
    # a single branch and the next piece of work, on a branch of its own,
    # silently built nothing.
    #
    # build-apk.yml now runs on every branch too (it had to, or a push that
    # touched only shared/ ran no tests at all), so both fire on a push here
    # and both publish a test APK of the same commit under the same
    # applicationId and signing key. See the version-code step below: that
    # overlap is why it has to look at this branch's builds and not just
    # main's.
    branches:
      - 'claude/**'

permissions:
  contents: write   # to publish the prerelease
  actions: read     # to read main's newest build number, for the version code

concurrency:
  group: ask-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Must be at least the minimum the Android plugin in gradle/libs.versions.toml
      # asks for, and build-apk.yml has to agree: when the KMP port raised the
      # plugin, this workflow was left behind and every branch build died at
      # "Minimum supported Gradle version is 9.4.1".
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # Only the debug keystore: there is no upload keystore in this repository
      # (the app is not on Play), so restoring one would fail.
      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      # One above every build-apk.yml build the phone could already be holding.
      # Android refuses to install a lower versionCode over a higher one, and
      # this workflow's own run_number starts at 1 — so without this the phone
      # would reject the test build and the only way on would be to uninstall,
      # which deletes the hand-entered stat lines the reader cannot get back.
      #
      # Main's newest is not enough on its own. build-apk.yml numbers its APKs
      # with github.run_number, a counter it advances on EVERY branch too, and
      # it publishes a test-apk-<branch> prerelease of this same commit. That
      # number is therefore already above main's newest, so taking main's + 1
      # handed the branch build the higher versionCode and this one — the only
      # APK patched to read the branch's own ask-data.json — would then refuse
      # to install over it. Take the higher of the two and add one.
      - name: Number this build above every build-apk build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions/workflows/build-apk.yml/runs"
          main_latest=$(gh api "$api?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].run_number // 0')
          # No status filter: the run for this very commit is still going, and
          # its number is already taken.
          branch_latest=$(gh api \
            "$api?branch=$GITHUB_REF_NAME&per_page=1" \
            --jq '.workflow_runs[0].run_number // 0')
          echo "Newest main build: $main_latest; newest on this branch: $branch_latest"
          latest=$main_latest
          [ "$branch_latest" -gt "$latest" ] && latest=$branch_latest
          echo "VERSION_CODE=$((latest + 1))" >> "$GITHUB_ENV"

      - name: Test the data pack
        run: python3 scripts/test_ask_pack.py

      # The committed pack must match what ask_pack.py builds from the
      # committed seed and scrape. Otherwise the APK ships instructions and a
      # table list that the pack it downloads does not have.
      - name: The committed pack is current
        run: |
          python3 scripts/ask_pack.py
          git diff --exit-code docs/ask-data.json

      # build-apk.yml runs these on branches too. Keep them here as well: this
      # workflow publishes the APK the reader is told to install, and it should
      # not ship one on the strength of another workflow's green tick.
      # Both halves, as build-apk.yml runs them: the shared module's own tests
      # are in commonTest and :app:testDebugUnitTest does not reach them.
      - name: Run the unit tests
        run: gradle :app:testDebugUnitTest :shared:testAndroidHostTest -Proborazzi.test.verify=true

      # Ask Claude reads its tables and instructions from ask-data.json, which
      # the app downloads from the published dashboard. A branch that changes
      # them has to be tested against the branch's own copy, so the test build
      # reads that one first; the published dashboard is untouched.
      - name: Point Ask Claude at this branch's data
        run: |
          # The KMP port moved the engine into the shared module; a branch cut
          # before that still has it under app/. Take whichever one is here.
          engine=shared/src/commonMain/kotlin/com/example/data/AskEngine.kt
          [ -f "$engine" ] || engine=app/src/main/java/com/example/data/AskEngine.kt
          sed -i "s#\"https://inspectorgad.github.io/ku-sb/ask-data.json\",#\"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/docs/ask-data.json\", &#" \
            "$engine"
          grep -n "ask-data.json" "$engine"
          # A sed that quietly matched nothing would ship a test APK reading
          # the published pack instead of this branch's, which is the one
          # thing this step exists to prevent. Fail loudly instead.
          grep -q "raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA" "$engine"

      - name: Build the APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: gradle :app:assembleDebug

      - name: Publish the test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ku-sb-ask-test.apk
          gh release view ask-test --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create ask-test \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KU Softball — Ask Claude test build" \
              --notes "Test build of the Ask Claude web search and other-teams work, for installing over the everyday app before it is merged. Same applicationId and the same debug signing key, so it updates in place and keeps your data. Its Ask Claude reads this branch's ask-data.json. The everyday APK is unaffected and stays at the latest-apk release." \
              --prerelease --latest=false
          gh release upload ask-test ku-sb-ask-test.apk --repo "$GITHUB_REPOSITORY" --clobber
          echo "Test APK: https://github.com/$GITHUB_REPOSITORY/releases/download/ask-test/ku-sb-ask-test.apk"
