name: Build debug APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'scripts/build-dashboard.py'
      - '.github/workflows/deploy-pages.yml'
      - 'probe/**'
      - 'probe4/**'
      - 'probe5/**'
      - 'probe6/**'
      - 'probe7/**'
      - 'probe8/**'
      - 'probe2/**'
      - 'probe3/**'
      - 'DATA-VALIDATION.md'
      - 'scripts/probe-ku-sb.mjs'
      - 'scripts/probe2-ku-sb.mjs'
      - 'scripts/probe3-ku-sb.mjs'
      - '.github/workflows/probe-data.yml'
      - '.github/workflows/probe2-data.yml'
      - '.github/workflows/probe3-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # The debug keystore is committed on purpose — its password is the
      # Android default and a fixed debug identity is what lets `adb install -r`
      # replace an installed build. The upload keystore is not here any more;
      # this app is not on Play, so nothing needs signing for release.
      - name: Restore debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Run unit tests
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest 2>&1 | tee -a /tmp/gradle-output.txt

      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleDebug 2>&1 | tee -a /tmp/gradle-output.txt

      # Scaffolding for the multiplatform port, removed before it merges.
      # Neither half of the usual loop is available from the machine doing the
      # work: dl.google.com is refused by its network policy so Gradle cannot
      # run there at all, and the Actions log is served from blob storage,
      # which is refused as well. Committing the output to the branch is the
      # one channel that does get through, since the git API is reachable.
      - name: Commit the build output when it fails
        if: failure() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p ci-logs
          {
            echo "run ${{ github.run_number }} · commit ${{ github.sha }}"
            echo
            tail -c 120000 /tmp/gradle-output.txt || echo "(no gradle output captured)"
            echo
            echo "=== failing test reports ==="
            find . -path '*/build/reports/tests/*' -name '*.html' -newermt '-1 hour' | head -20 || true
            for f in $(find . -path '*/build/test-results/*' -name 'TEST-*.xml' | head -40); do
              grep -l '<failure\|<error' "$f" >/dev/null 2>&1 && { echo "--- $f"; sed -n '1,120p' "$f"; }
            done
          } > ci-logs/last-failure.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci-logs/last-failure.txt
          git commit -m "CI: build output for run ${{ github.run_number }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ku-sb-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Publish the APK to a rolling "latest-apk" release for one-tap phone
      # download:
      # https://github.com/inspectorgad/ku-sb/releases/latest/download/app-debug.apk
      # main publishes the rolling release the installed app updates from.
      # A branch publishes its own prerelease instead, so a test build can
      # never replace the stable APK, and never touches season-data.json or
      # ask-data.json — which the installed app downloads from "latest".
      - name: Publish APK to rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-apk --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create latest-apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KU Softball - latest build" \
              --notes "Rolling release: always carries the newest APK with current season data. Download app-debug.apk below and install it on your Android device." \
              --latest
          gh release upload latest-apk app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          # The parsed season data rides along so the app can sync itself
          # without an APK reinstall.
          cp app/src/main/assets/seed.json season-data.json
          gh release upload latest-apk season-data.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          # And the tables behind "Ask about the team", so the app can reach
          # them without naming a branch in a raw.githubusercontent URL.
          python3 scripts/ask_pack.py
          cp docs/ask-data.json ask-data.json
          gh release upload latest-apk ask-data.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish a branch test APK
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="test-apk-$(echo "$BRANCH" | tr '/' '-')"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "KU Softball - test build ($BRANCH)" \
              --notes "Test build from \`$BRANCH\`, for installing over the current app before the branch is merged. Same applicationId and the same debug signing key as the stable build, so it updates in place and keeps existing data. The stable APK is unaffected and stays at the latest-apk release." \
              --prerelease
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "Test APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/app-debug.apk"
