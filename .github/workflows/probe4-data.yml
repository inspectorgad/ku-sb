name: Probe 4 - Rankings + conference tags

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe4-ku-sb.mjs'
      - '.github/workflows/probe4-data.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run rankings/standings probe
        run: node scripts/probe4-ku-sb.mjs

      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f probe4/
          git diff --cached --quiet || git commit -m "Add rankings/standings probe results [skip ci]"
          git push
